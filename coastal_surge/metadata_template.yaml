# ---------------------------------------------------------------------------
# Global NetCDF metadata template for the SurgeMIP surge extraction pipeline.
#
# Copy this file, fill in the fields for your run/institution, and pass it
# to either pipeline script with:
#
#   --metadata-yaml path/to/your_metadata.yaml
#
# Any field left blank (or omitted entirely) falls back to the built-in
# default in nc_metadata.py. Fields that describe the data itself rather
# than its provenance (geospatial extent, time coverage, date_created,
# title/summary) are computed automatically and are not set here.
# ---------------------------------------------------------------------------

# Short, unique dataset identifier (no spaces).
id: "SurgeMIP_shoreline_waterlevels"

# Name of the overarching project/campaign this output belongs to.
project: "SurgeMIP"

# Free-text funding/credit statement.
acknowledgment: ""

# General point of contact for questions about this dataset, e.g.
# "Jane Doe <jane.doe@anl.gov>". For attributing specific people/roles,
# use creator_*/researcher_* below instead.
contact: ""

# --- Creator (the person/team that produced this specific output file) ---
creator_name: ""
creator_id: ""       # e.g. an ORCID URL: "https://orcid.org/0000-0000-0000-0000"
creator_email: ""

# --- Researcher / PI (the scientist responsible for the underlying study) ---
researcher_name: ""
researcher_id: ""     # e.g. an ORCID URL
researcher_email: ""
researcher_affiliation: ""

# Data usage license, e.g. "CC-BY-4.0".
license: ""

# Organization that produced the data.
institution: "Argonne National Laboratory"

# Persistent identifier for the institution above, e.g. a ROR URL:
# "https://ror.org/03qjp1d79".
institution_id: ""

# Name of the sea/ocean region covered, e.g. "global", "Gulf of Mexico".
sea_name: "global"

# Model description, e.g.
# "ADCIRC STOFS2D-Global, CFS reanalysis atmospheric forcing".
source: ""

# Atmospheric/tidal forcing dataset(s) driving the model, e.g.
# "REMO MPI-ESM rcp26 and FES2004".
forcing: ""

# Horizontal coordinate reference system of the station coordinates.
crs: "WGS84"

# Semicolon-separated search keywords.
keywords: "storm surge; coastal flooding; water level; ADCIRC; SurgeMIP"

# CF standard name table version used by variable `standard_name` attributes.
standard_name_vocabulary: "CF Standard Name Table"

# Citable reference(s) for the model/methodology, e.g. a DOI or paper.
references: ""

# Free-text field for anything else worth noting about this run.
comment: ""
