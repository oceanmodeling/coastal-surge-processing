[project]
authors = [{name = "William Pringle", email = "wpringle@anl.gov"}]
dependencies = []
name = "coastal-surge-processing"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
coastal_surge_processing = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
netcdf4 = ">=1.7.4,<2"
pandas = ">=3.0.5,<4"
pyyaml = ">=6.0.3,<7"
scipy = ">=1.18.0,<2"
